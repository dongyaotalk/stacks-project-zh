name: Translation or source problem
description: Report a translation, mathematical, structure, or upstream-source issue
title: "[issue] "
labels: ["translation"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Translation meaning
        - Mathematical correctness
        - Terminology
        - LaTeX structure or rendering
        - English upstream source
        - Tooling or QA
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - blocker
        - critical
        - major
        - minor
        - note
    validations:
      required: true
  - type: input
    id: source_commit
    attributes:
      label: English source commit
      placeholder: Full 40-character SHA
    validations:
      required: true
  - type: input
    id: unit_id
    attributes:
      label: Unit ID or Tag
    validations:
      required: true
  - type: textarea
    id: locations
    attributes:
      label: English and Chinese locations
      description: Quote only the minimal text needed and preserve protected placeholders
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: Explanation and minimal proposed change
      description: Explain the evidence; do not rewrite unrelated text
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I have not included credentials, private data, or unlicensed files.
          required: true

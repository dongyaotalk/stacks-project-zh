name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Chinese repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check out locked English harvest
        shell: bash
        run: |
          set -euo pipefail
          repository=$(sed -n 's/^repository = "\(.*\)"$/\1/p' upstream.lock)
          commit=$(sed -n 's/^commit = "\(.*\)"$/\1/p' upstream.lock)
          test -n "$repository"
          test -n "$commit"
          mkdir ../stacks-project
          git -C ../stacks-project init
          git -C ../stacks-project remote add origin "$repository"
          git -C ../stacks-project fetch --depth 1 origin "$commit"
          git -C ../stacks-project checkout --detach FETCH_HEAD

      - name: Dispatch current validation from trusted comparison tools
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          force=()
          if test -z "$EVENT_BASE" || test "$EVENT_BASE" = 0000000000000000000000000000000000000000; then
            compare="$EVENT_HEAD"
            force=(--force-broad)
          else
            compare=$(git merge-base "$EVENT_BASE" "$EVENT_HEAD")
            git merge-base --is-ancestor "$compare" "$EVENT_BASE"
          fi
          # The trusted main event base is an explicit local anchor for the
          # same Base contract used by local checks. Never read it from PR data.
          if test -n "$EVENT_BASE" && test "$EVENT_BASE" != 0000000000000000000000000000000000000000; then
            git update-ref refs/remotes/origin/main "$EVENT_BASE"
          else
            git update-ref refs/remotes/origin/main "$EVENT_HEAD"
          fi
          git worktree add --detach ../ci-trusted-tools "$compare"
          driver=../ci-trusted-tools/scripts/ci-current.py
          if ! test -f "$driver"; then
            driver=scripts/ci-current.py
            force=(--force-broad)
          fi
          python "$driver" --root "$PWD" --harvest "$PWD/../stacks-project" \
            --base-ref "$compare" "${force[@]}"

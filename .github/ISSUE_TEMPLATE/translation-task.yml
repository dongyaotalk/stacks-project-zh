name: Translation task
description: Claim a stable Stacks Project section or set of units
title: "[task] "
labels: ["translation", "claimed"]
body:
  - type: markdown
    attributes:
      value: |
        Use stable source coordinates. Do not use PDF pages or source line numbers.
        Read `AGENTS.md`, `WORKFLOW.md`, and `docs/task-allocation.md` first.
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: Short stable name, for example categories-001M
      placeholder: categories-001M
    validations:
      required: true
  - type: input
    id: source_commit
    attributes:
      label: English source commit
      description: Full 40-character SHA from upstream.lock
      placeholder: a04446e57ec1fbc252a871afcec7752fb2807b14
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter
      placeholder: categories
    validations:
      required: true
  - type: input
    id: parent_tag
    attributes:
      label: Section or parent Tag
      placeholder: 001M
    validations:
      required: true
  - type: textarea
    id: unit_ids
    attributes:
      label: Unit IDs
      description: One stable unit_id per line, or one exact batch file
      placeholder: |
        tag:001M:title
        tag:001M:statement
        tag:001M:p001
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: GitHub username that will open the PR
      placeholder: "@username"
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      description: Exact planned translation branch
      placeholder: translate/categories/001m/openai-gpt-5-6-sol
    validations:
      required: true
  - type: textarea
    id: allowed_write_files
    attributes:
      label: Allowed write files
      description: Exact run and candidate paths, one per line; no generated files
      placeholder: |
        translation-data/runs/run-20260825-categories-001m-gpt56sol-01.json
        translation-data/candidates/openai-gpt-5.6-sol/categories-001M.jsonl
    validations:
      required: true
  - type: input
    id: harness_id
    attributes:
      label: Harness ID and version
      description: Execution tool, not the model; version is resolved at run time by `make harness-check`
      placeholder: codex (run `make harness-check HARNESS_ID=codex`)
    validations:
      required: true
  - type: input
    id: model_id
    attributes:
      label: Concrete model ID
      description: The actual model that will generate the candidate
      placeholder: gpt-5.6-sol
    validations:
      required: true
  - type: input
    id: model_record_id
    attributes:
      label: Model record ID
      description: Exact entry from config/models.yml
      placeholder: openai:gpt-5.6-sol:owner-confirmed
    validations:
      required: true
  - type: input
    id: run_id
    attributes:
      label: Translation run ID
      description: New immutable run ID for this execution
      placeholder: run-20260825-categories-001m-gpt56sol-01
    validations:
      required: true
  - type: input
    id: model_lane
    attributes:
      label: Candidate lane
      description: Directory/render slug; not sufficient as model identity
      placeholder: openai-gpt-5.6-sol
    validations:
      required: true
  - type: input
    id: prompt_version
    attributes:
      label: Prompt version
      description: Current production prompt from prompts/README.md
      placeholder: translator-v2
    validations:
      required: true
  - type: dropdown
    id: review_roles
    attributes:
      label: Required review
      options:
        - Language review only
        - Language and mathematics review
        - Terminology decision
        - Tool or documentation review
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan and blockers
      description: Expected timing, review handoff, and known blockers
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope confirmation
      options:
        - label: I will not modify the English harvest or change upstream.lock.
          required: true
        - label: I will not modify units outside this task.
          required: true
        - label: I will use a separate PR for terminology, upstream sync, or tooling.
          required: true
        - label: I will run the required QA and report failures rather than bypassing them.
          required: true
        - label: I will create a run manifest and will not infer the model from the Harness name.
          required: true

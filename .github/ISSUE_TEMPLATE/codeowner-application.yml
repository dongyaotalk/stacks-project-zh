name: Maintainer / CODEOWNER application
description: Apply for long-term maintenance responsibility and scoped review ownership
title: "[governance] Maintainer/CODEOWNER application: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Anyone may contribute without this role. Apply only when you are ready to
        maintain a bounded area and review other contributors' work over time.
        CODEOWNERS entries require explicit GitHub write access and do not by
        themselves establish language or mathematics review qualifications.
  - type: input
    id: account
    attributes:
      label: GitHub account
      placeholder: "@username"
    validations:
      required: true
  - type: dropdown
    id: requested_role
    attributes:
      label: Requested role
      options:
        - Maintainer
        - CODEOWNER
        - Maintainer and CODEOWNER
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Exact responsibility and CODEOWNERS paths
      description: Use the narrowest paths that cover the proposed responsibility.
      placeholder: |
        Responsibility: Python tooling and deterministic QA
        Paths:
        - /stacks_zh/**
        - /scripts/**
        - /tests/**
    validations:
      required: true
  - type: dropdown
    id: permission
    attributes:
      label: Minimum GitHub permission requested
      options:
        - Triage (not sufficient for CODEOWNER)
        - Write
        - Maintain
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence of contribution and review ability
      description: Link merged PRs, review records, terminology decisions, or relevant public work.
    validations:
      required: true
  - type: checkboxes
    id: qualifications
    attributes:
      label: Review areas
      description: Select only areas in which you can provide accountable human review.
      options:
        - label: Chinese language review
        - label: Mathematics review
        - label: Terminology maintenance
        - label: Python, Schema, QA, or CI maintenance
        - label: Upstream synchronization
        - label: Licensing and release
  - type: textarea
    id: availability
    attributes:
      label: Availability and handoff plan
      description: State timezone, expected response window, and how you will report an absence.
    validations:
      required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Conflicts, affiliations, or limitations
      description: Disclose anything relevant, or write "None".
    validations:
      required: true
  - type: checkboxes
    id: commitments
    attributes:
      label: Commitments
      options:
        - label: I have read WORKFLOW.md, GOVERNANCE.md, MAINTAINERS.md, and the review rules.
          required: true
        - label: I will enforce source locking, model provenance, review, security, and licensing rules.
          required: true
        - label: I understand CODEOWNER status is scoped responsibility, not automatic approval authority for every area.
          required: true
        - label: I accept a narrower path, trial period, or later removal if availability or project needs change.
          required: true
  - type: textarea
    id: administrator_decision
    attributes:
      label: Administrator decision (maintainer use)
      description: Decision, paths, permission, trial/review dates, and rationale. Applicants should leave this blank.

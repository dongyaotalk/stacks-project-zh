name: Translation or source problem
description: Report a translation, mathematical, structure, or upstream-source issue
title: "[issue] "
labels: ["translation"]
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: Stable ID to use if this report leads to a PR
      placeholder: issue-guide-04V1-wording
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: GitHub username responsible for the eventual PR
      placeholder: "@username"
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      description: Exact planned branch, or `unclaimed` until assigned
      placeholder: review/guide/04v1
    validations:
      required: true
  - type: textarea
    id: allowed_write_files
    attributes:
      label: Allowed write files
      description: Exact files or narrow directory prefixes for the eventual PR
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Translation meaning
        - Mathematical correctness
        - Terminology
        - LaTeX structure or rendering
        - English upstream source
        - Tooling or QA
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - blocker
        - critical
        - major
        - minor
        - note
    validations:
      required: true
  - type: input
    id: source_commit
    attributes:
      label: English source commit
      placeholder: Full 40-character SHA
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter
    validations:
      required: true
  - type: input
    id: parent_tag
    attributes:
      label: Section or parent Tag
    validations:
      required: true
  - type: textarea
    id: unit_ids
    attributes:
      label: Unit IDs
      description: One exact unit ID per line
    validations:
      required: true
  - type: textarea
    id: locations
    attributes:
      label: English and Chinese locations
      description: Quote only the minimal text needed and preserve protected placeholders
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: Explanation and minimal proposed change
      description: Explain the evidence; do not rewrite unrelated text
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I have not included credentials, private data, or unlicensed files.
          required: true

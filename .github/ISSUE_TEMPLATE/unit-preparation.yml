name: Translation scope preparation
description: Request stable units for a favorite chapter or Tag that is not ready for candidate translation
title: "[scope] Prepare translation units: "
labels: ["translation", "tooling"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when the desired text is not present in `translation-data/units/`.
        Do not hand-create unit IDs or translate raw TeX in this Issue.
  - type: input
    id: task_id
    attributes:
      label: Task ID
      placeholder: guide-04V1-scope
    validations:
      required: true
  - type: input
    id: source_commit
    attributes:
      label: English source commit
      description: Full 40-character SHA from upstream.lock
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Upstream chapter
      placeholder: schemes
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Permanent Tag or full label
      description: Single-scope task only; leave blank for a multi-Tag batch. If absent, explain below.
      placeholder: 01IQ or schemes-lemma-example
  - type: textarea
    id: parent_tags
    attributes:
      label: Permanent Tags
      description: Batch task only; list 2–8 adjacent permanent Tags, one per line, and leave the singular field blank
      placeholder: |
        04AO
        04AP
  - type: textarea
    id: location
    attributes:
      label: Stable source evidence
      description: Link the Stacks Project page and give the English heading or minimal identifying text. Do not use only a PDF page or line number.
    validations:
      required: true
  - type: textarea
    id: desired_scope
    attributes:
      label: Desired semantic scope
      description: State whether you want one Section, definition, statement/proof pair, or another complete boundary.
    validations:
      required: true
  - type: textarea
    id: unit_ids
    attributes:
      label: Unit IDs
      description: Maintainer fills the final stable IDs before opening the scope PR
      placeholder: |
        tag:04V1:title
        tag:04V1:p001
  - type: input
    id: owner
    attributes:
      label: Owner
      description: GitHub username that will open the scope PR
      placeholder: "@username"
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      description: Exact planned scope branch
      placeholder: tool/scope/guide-04v1/openai-gpt-5-6-sol
    validations:
      required: true
  - type: textarea
    id: allowed_write_files
    attributes:
      label: Allowed write files
      description: Exact unit file paths, one per line; update this field before opening the PR
      placeholder: |
        translation-data/units/categories-04AO.jsonl
        translation-data/units/categories-04AP.jsonl
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why you want to translate this part
      description: This helps prioritize extraction but does not affect acceptance standards.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope confirmation
      options:
        - label: I will wait for stable units and a task claim before submitting candidate data.
          required: true
        - label: I will not edit the English harvest, upstream.lock, or raw source TeX.
          required: true
        - label: I understand extraction/Tag mapping is a tooling task separate from translation.
          required: true

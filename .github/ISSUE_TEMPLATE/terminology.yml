name: Terminology decision
description: Propose, approve, or deprecate a mathematical term
title: "[term] "
labels: ["terminology"]
body:
  - type: input
    id: source_term
    attributes:
      label: English source term
      description: Preserve the relevant source form and qualifiers
    validations:
      required: true
  - type: input
    id: target_term
    attributes:
      label: Proposed Chinese term
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: Requested decision
      options:
        - proposed
        - approved
        - deprecated
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Definition or mathematical context
      description: Explain the Stacks Project-specific meaning
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source evidence
      description: List source commit, chapter, Tag, and unit_id
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and reason
      description: Include rejected alternatives and the reason for this choice
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: Migration impact
      description: Existing candidates or reviewed units affected by this decision
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Policy confirmation
      options:
        - label: This decision is separate from bulk translation changes.
          required: true
        - label: Approval will be made by a human terminology maintainer.
          required: true
        - label: Every mathematical occurrence will continue to retain English.
          required: true

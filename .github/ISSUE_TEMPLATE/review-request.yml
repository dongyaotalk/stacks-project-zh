name: Review request
description: Request language or mathematics review for a bounded set of units
title: "[review] "
labels: ["review"]
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      placeholder: review-categories-001M
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      placeholder: "@username"
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      placeholder: review/categories/001m
    validations:
      required: true
  - type: textarea
    id: allowed_write_files
    attributes:
      label: Allowed write files
      description: Exact review/revision files for the eventual PR
    validations:
      required: true
  - type: input
    id: source_commit
    attributes:
      label: English source commit
      description: Full SHA used by the candidate
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter
    validations:
      required: true
  - type: input
    id: parent_tag
    attributes:
      label: Section or parent Tag
      description: Single-scope review only; leave blank for a multi-Tag batch
  - type: textarea
    id: parent_tags
    attributes:
      label: Section or parent Tags
      description: Batch review only; list 2–8 adjacent permanent Tags, one per line, and leave the singular field blank
  - type: textarea
    id: unit_ids
    attributes:
      label: Unit IDs
      description: One exact unit ID per line
      placeholder: |
        tag:001M:title
        tag:001M:p001
    validations:
      required: true
  - type: dropdown
    id: review_level
    attributes:
      label: Review level
      options:
        - Language
        - Mathematics
        - Language and mathematics
    validations:
      required: true
  - type: textarea
    id: candidate
    attributes:
      label: Candidate provenance
      description: Candidate hash, model lane, prompt version, and PR
    validations:
      required: true
  - type: textarea
    id: focus
    attributes:
      label: Review focus
      description: Note definitions, proofs, terminology, or known risks
    validations:
      required: true

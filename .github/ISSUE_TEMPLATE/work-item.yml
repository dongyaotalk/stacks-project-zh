name: Tool, documentation, build, or policy task
description: Claim a non-translation work item before opening a Pull Request
title: "[task] "
labels: ["claimed"]
body:
  - type: markdown
    attributes:
      value: |
        Every Pull Request starts from one claimed Issue. Keep the write scope
        narrow; use a specialized translation, review, terminology, or scope
        template when one applies.
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: Short stable name used by the branch, commit, and PR
      placeholder: tooling-pr-contract
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: GitHub username that will open the PR
      placeholder: "@username"
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      description: Exact planned head branch
      placeholder: tool/short-feature
    validations:
      required: true
  - type: textarea
    id: allowed_write_files
    attributes:
      label: Allowed write files
      description: One exact file or narrow directory prefix ending in / per line; no globs
      placeholder: |
        stacks_zh/example.py
        tests/test_example.py
        docs/example.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
      description: State the current behavior and why a change is needed
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable checks that prove the task is complete
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope confirmation
      options:
        - label: I will keep the PR inside the declared write paths.
          required: true
        - label: I will run the applicable local LaTeX build before committing.
          required: true
        - label: I will open the PR with `Closes #<this-issue>` and the task ID.
          required: true

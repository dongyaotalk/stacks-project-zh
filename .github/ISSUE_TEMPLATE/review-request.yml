name: Review request
description: Request language or mathematics review for a bounded set of units
title: "[review] "
labels: ["review"]
body:
  - type: input
    id: source_commit
    attributes:
      label: English source commit
      description: Full SHA used by the candidate
    validations:
      required: true
  - type: input
    id: translation_units
    attributes:
      label: Translation unit or Section
      placeholder: tag:001M
    validations:
      required: true
  - type: dropdown
    id: review_level
    attributes:
      label: Review level
      options:
        - Language
        - Mathematics
        - Language and mathematics
    validations:
      required: true
  - type: textarea
    id: candidate
    attributes:
      label: Candidate provenance
      description: Candidate hash, model lane, prompt version, and PR
    validations:
      required: true
  - type: textarea
    id: focus
    attributes:
      label: Review focus
      description: Note definitions, proofs, terminology, or known risks
    validations:
      required: true
